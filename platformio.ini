; LilyGO T-Encoder Pro — USB media knob
; Build:  pio run          Flash: pio run -t upload       Logs: pio device monitor

[platformio]
; Short build paths avoid Windows' 260-char path limit.
build_dir = C:/tenc/build
libdeps_dir = C:/tenc/libdeps

[env:t-encoder-pro]
; pioarduino = Arduino-ESP32 core 3.0.7 (the version LilyGO tests against)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; USB_MODE=0 -> native USB runs TinyUSB, so the board shows up as a
; media keyboard (HID) plus a serial port (CDC) for logs.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; Restarts the board into its bootloader and finds its port before each upload.
extra_scripts = pre:scripts/upload_reset.py

monitor_speed = 115200
